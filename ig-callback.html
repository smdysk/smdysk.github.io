<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Instagramの接続 | Instagram to GBP autopost</title>
<style>
:root{--fg:#1b1b1b;--muted:#5a5a5a;--line:#e3e3e3;--bg:#fff;--accent:#1a4f8a;--warn:#8a1a1a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.9}
main{max-width:44rem;margin:0 auto;padding:3rem 1.25rem 5rem}
h1{font-size:1.4rem;line-height:1.5;margin:0 0 1rem}
p{margin:.7rem 0}
.code{display:block;width:100%;min-height:7rem;padding:.75rem;border:1px solid var(--line);border-radius:6px;font-family:ui-monospace,Consolas,monospace;font-size:1rem;word-break:break-all;resize:none}
button{margin-top:.75rem;padding:.7rem 1.4rem;font-size:1.05rem;border:0;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.done{color:var(--accent);font-weight:bold}
.error{color:var(--warn)}
.muted{color:var(--muted);font-size:.9rem}
footer{margin-top:3.5rem;padding-top:1.25rem;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
<div id="ok" hidden>
<h1>許可ありがとうございました</h1>
<p>下の枠の中の文字が、接続のための番号です。</p>
<p>「コピーする」を押してから、ランサーズのメッセージに貼り付けて送ってください。</p>
<textarea id="code" class="code" readonly></textarea>
<button type="button" id="copy">コピーする</button>
<p id="copied" class="done" hidden>コピーしました。ランサーズのメッセージに貼り付けてください。</p>
<p class="muted">この番号は1時間で使えなくなります。お手数ですが、なるべく早めにお送りください。</p>
</div>
<div id="denied" hidden>
<h1>許可されませんでした</h1>
<p class="error">接続の許可が取り消されたか、途中で止まりました。お手数ですが、もう一度最初の手順からお試しください。</p>
</div>
<div id="empty" hidden>
<h1>このページについて</h1>
<p>Instagramの接続の許可を押したあとに表示されるページです。</p>
</div>
<footer><a href="./privacy.html">プライバシーポリシー</a></footer>
</main>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var code = (params.get("code") || "").replace(/#_$/, "");
  if (code) {
    document.getElementById("code").value = code;
    document.getElementById("ok").hidden = false;
    document.getElementById("copy").addEventListener("click", function () {
      var box = document.getElementById("code");
      box.select();
      var shown = function () { document.getElementById("copied").hidden = false; };
      if (navigator.clipboard) {
        navigator.clipboard.writeText(code).then(shown, function () { document.execCommand("copy"); shown(); });
      } else {
        document.execCommand("copy");
        shown();
      }
    });
  } else if (params.get("error")) {
    document.getElementById("denied").hidden = false;
  } else {
    document.getElementById("empty").hidden = false;
  }
  if (window.history && window.history.replaceState) {
    window.history.replaceState(null, "", window.location.pathname);
  }
})();
</script>
</body>
</html>
